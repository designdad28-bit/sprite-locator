name: Update Sprite catalog

# Re-scrapes fortnite.gg (+ the wiki as fallback) and commits
# public/data/sprites.json if it changed. Intentionally simple: no matrix,
# no release process — just "run the pipeline, commit if the data moved."
on:
  schedule:
    # Every 6 hours. Fortnite patches aren't on a fixed schedule, so this is
    # a polling cadence, not a webhook — tune as needed.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the Sprite catalog pipeline
        run: npm run sprites:scrape

      - name: Commit sprites.json if it changed
        run: |
          if git diff --quiet -- public/data/sprites.json; then
            echo "No changes to public/data/sprites.json"
            exit 0
          fi
          git config user.name "sprite-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/sprites.json
          git commit -m "chore: refresh Sprite catalog"
          git push
